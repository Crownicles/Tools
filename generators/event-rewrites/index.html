<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crownicles — Réécriture des big events</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <div>
        <h1>✍️ Réécriture des big events</h1>
        <p id="subtitle">Comparaison avant / après des big events réécrits.</p>
    </div>
    <div class="header-actions">
        <a href="../../index.html" class="home">🏠 Outils</a>
    </div>
</header>
<main>
    <aside id="controls">
        <section id="source">
            <h2>Branches de Crownicles</h2>
            <form id="ghForm">
                <label>Avant <input type="text" id="ghBase" list="ghBranches" placeholder="develop" autocomplete="off" spellcheck="false"></label>
                <label>Après <input type="text" id="ghHead" list="ghBranches" placeholder="branche à comparer" autocomplete="off" spellcheck="false"></label>
                <label class="check small"><input type="checkbox" id="ghAll"> Inclure les events identiques</label>
                <button type="submit" id="ghLoad" class="btn">Comparer</button>
                <p id="ghStatus" class="muted small"></p>
                <datalist id="ghBranches"></datalist>
            </form>
        </section>
        <section>
            <h2>Events</h2>
            <ul id="eventList"></ul>
        </section>
        <details id="profile" class="fold">
            <summary><span class="fold-title">🎚️ Profil de joueur</span> <span id="profileSummary" class="fold-sub"></span></summary>
            <div class="fold-body">
                <label class="check"><input type="checkbox" id="profileOn"> Filtrer les issues « après »</label>
                <p class="muted small">Les issues impossibles pour ce profil sont grisées.</p>
                <div id="profileFields">
                    <div class="grid2">
                        <label>Niveau <input type="number" id="pLevel" value="50" min="1"></label>
                        <label>Karma <input type="number" id="pKarma" value="0"></label>
                        <label>Attaque <input type="number" id="pAttack" value="200" min="0"></label>
                        <label>Défense <input type="number" id="pDefense" value="200" min="0"></label>
                        <label>Vitesse <input type="number" id="pSpeed" value="200" min="0"></label>
                        <label>PV actuels <input type="number" id="pHealth" value="500" min="1"></label>
                    </div>
                    <label>Classe <select id="pClass"></select></label>
                    <label>Familier <select id="pPet"></select></label>
                    <div class="grid2">
                        <label>Cuisine <input type="number" id="pCooking" value="0" min="0"></label>
                        <label>Sac <select id="pMaterials"><option value="1">plein</option><option value="0">vide</option></select></label>
                        <label>Arme améliorée <input type="number" id="pWeaponLevel" value="0" min="0" max="4"></label>
                        <label>Armure améliorée <input type="number" id="pArmorLevel" value="0" min="0" max="4"></label>
                    </div>
                    <label>Enchantement de l'arme <select id="pWeaponEnchant"></select></label>
                    <label>Enchantement de l'armure <select id="pArmorEnchant"></select></label>
                </div>
            </div>
        </details>
        <p id="generated" class="muted small"></p>
    </aside>
    <div id="content"></div>
</main>
<script src="github.js"></script>
<script src="app.js"></script>
</body>
</html>
